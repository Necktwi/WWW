<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8"/>
      <title>Stream Player</title>
      <base id="bas"/>
      <style>
         body { margin: 0; background: #000; color: #fff}
         video { max-width: 100%; max-height: 100vh; }
         #chat-container {
            display: none;
            width: 100%;
            height: auto;
            border-top: 1px solid #333;
            flex: 1;
         }
         #chat-iframe {
            width: 100%;
            height: calc(100vh - videoHeight);
            min-height: 9cm;
            border: none;
         }
         a {
            color: #7777ff;
         }
      </style>
   </head>
   <body>
      <video id="video" controls muted preload="auto" playsinline></video>
      <div>Chat: <a id="chatLink" 
         href="https://web.libera.chat/gamja#doom-Necktwi">
         https://web.libera.chat/gamja#doom-Necktwi</a></div>
      <div id="chat-container">
         <iframe id="chat-iframe" 
            src="https://web.libera.chat/gamja#doom-Necktwi"
            style="border:0; width:100%;"></iframe>
      </div>
      <style>
         #liveBtn {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            z-index: 100;
         }
         #liveBtn:hover {
            background: darkred;
         }
      </style>
      <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js">
      </script>
      <script>
         let bn= window.location.pathname;
         bn= bn.substr(0, bn.lastIndexOf('/')+1);
         let url= window.location.search.substr(1);
         if (url.startsWith('/')) url = url.substring(1);
         const chatContainer = document.getElementById('chat-container');
         if (chatContainer) {
            const chatIframe = document.getElementById('chat-iframe');
            const chatLink = document.getElementById('chatLink');
            if (url.startsWith('user/')) {
               const urlParts = url.split('/');
               if (urlParts.length >= 2) {
                  const username = urlParts[1];
                  const game = urlParts[2];
                  chatLink.href =
                  `https://web.libera.chat/gamja/#${game}-${username}`;
                  chatLink.innerHTML =
                  `https://web.libera.chat/gamja/#${game}-${username}`;
                  chatIframe.src =
                  `https://web.libera.chat/gamja/#${game}-${username}`;
                  if (url.endsWith('.m3u8')) {
                     chatContainer.style.display = 'block';
                     const video = document.getElementById('video');
                     const setChatHeight = () => {
                        const vidHt = video.clientHeight;
                        const chatHeight =
                        Math.max(window.innerHeight-vidHt, 9*0.393701*96);
                        chatIframe.style.height = `${chatHeight}px`;
                     };
                  }
               }
            }
         }
         if (url.endsWith(".m3u8")) {
            const video = document.getElementById('video');
            if (Hls.isSupported()) {
               const hls = new Hls({
                  liveSyncDuration: -1,
                  maxBufferLength: 30,
                  maxMaxBufferLength: 60,
                  minBufferLength: 5,
                  enableWorker: true,
                  backBuffer: 60
               });
               hls.loadSource(url);
               hls.attachMedia(video);
               hls.on(Hls.Events.MANIFEST_PARSED, () => {
                  video.play().catch(e => console.log('Play error:', e));
               });
               hls.on(Hls.Events.ERROR, (event, data) => {
                  if (data.fatal) {
                     switch (data.type) {
                        case 'networkError':
                        hls.loadSource(url);
                        break;
                        default:
                        hls.recoverMediaError();
                        break;
                     }
                  }
               });
               hls.on(Hls.Events.FRAG_BUFFERED, () => {
                  if (hls && hls.levels && hls.levels[0].details) {
                     const details = hls.levels[0].details;
                     // if (details.live) {
                     //    const end = 
                     //details.fragments[
                     //details.fragments.length - 1].start +
                     //details.targetDuration;
                     //    video.currentTime = end - 1;
                     // }
                  }
               });
           } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                const fullUrl = window.location.origin + 
                window.location.pathname + '?' + url;
                video.src = fullUrl;
                video.addEventListener('loadedmetadata', () => {
                    video.play();
                    setInterval(() => {
                        if (video.duration - video.currentTime > 2) {
                            video.currentTime = video.duration - 1;
                        }
                    }, 1000);
                });
            }
         }
      </script>
   </body>
</html>
